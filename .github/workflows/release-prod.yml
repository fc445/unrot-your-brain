name: Release (prod)

# Publish a full GitHub release (not a pre-release) tagged vX.Y.Z to build a
# prod DMG, with no dev features in it. Promoting a pre-release to a full
# release also lands here, and fails unless its tag is a plain vX.Y.Z.

on:
  release:
    types: [released]

jobs:
  dmg:
    permissions:
      contents: write
    uses: ./.github/workflows/build-dmg.yml
    with:
      channel: prod
      tag: ${{ github.event.release.tag_name }}
