name: Release (prod)

# Publish a full GitHub release (not a pre-release) tagged vX.Y.Z on master to
# build a prod DMG, with no dev features in it. master is production: a tag
# anywhere else is refused. Promoting a -dev pre-release to a full release also
# lands here, and is refused for its tag.

on:
  release:
    types: [released]

jobs:
  dmg:
    permissions:
      contents: write
    uses: ./.github/workflows/build-dmg.yml
    with:
      channel: prod
      tag: ${{ github.event.release.tag_name }}
