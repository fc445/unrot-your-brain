		000000000000000000000017 /* Bundle the frozen core */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Bundle the frozen core";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copy the frozen core into the app bundle, when there is one.\n#\n# Not a hard dependency: a Debug build runs the repo's interpreter instead, and\n# failing the build because nobody has run PyInstaller would make the Swift loop\n# wait on the Python packaging loop for no reason. A Release build without one\n# is a real problem, so that one is an error.\nset -eu\nSRC=\"${SRCROOT}/../build/dist/unrot-core\"\nDEST=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/unrot-core\"\n\nif [ ! -d \"${SRC}\" ]; then\n  if [ \"${CONFIGURATION}\" = \"Release\" ]; then\n    echo \"error: no frozen core at ${SRC}. Build it first:\" >&2\n    echo \"error:   uv run --group packaging pyinstaller packaging/unrot-core.spec --noconfirm --distpath build/dist --workpath build/work\" >&2\n    exit 1\n  fi\n  echo \"warning: no frozen core at ${SRC}; this build will use the repo interpreter\"\n  exit 0\nfi\n\nrm -rf \"${DEST}\"\nmkdir -p \"$(dirname \"${DEST}\")\"\ncp -R \"${SRC}\" \"${DEST}\"\n\n# cp -R preserves extended attributes, and codesign refuses a bundle that has\n# any: \"resource fork, Finder information, or similar detritus not allowed\".\n# The frozen core picks them up simply by having been written to a Mac disk.\nxattr -cr \"${DEST}\"\n\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ] && [ \"${EXPANDED_CODE_SIGN_IDENTITY}\" != \"-\" ]; then\n  find \"${DEST}\" -type f -perm -u+x -print0 |\n    xargs -0 -I{} codesign --force --timestamp --options runtime       --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" {}\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

