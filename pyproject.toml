[project]
name = "unrot"
version = "0.1.0"
description = "Detects concepts you accepted from an AI agent without understanding, and builds a personal knowledge graph from what you confirm."
readme = "README.md"
requires-python = ">=3.11"
# The store and capture layers are deliberately stdlib-only; these are the
# model layer's, and nothing below `unrot.detector` imports them. Analysis is a
# LangGraph graph (`unrot.pipeline`): one run per session, so LangSmith sees one
# linked trace rather than a scatter of unrelated calls. LangChain's integrations
# are the clients inside its nodes -- the OpenAI-compatible chat model, and
# TypeSafe's classifier for Jev. langchain-typesafe is an alpha and is pinned
# exactly: its request and response shapes may still move.
# fastapi/uvicorn are not optional: per the PRD the standalone surface IS the
# product -- Claude Code integration is capture-only -- so the thing that serves
# it is a dependency of the thing, not an extra.
dependencies = [
    "fastapi>=0.115",
    "langchain-openai>=0.2",
    "langchain-typesafe==0.0.1a3",
    "langgraph>=1.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unrot"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Spawns a real server in a subprocess. Kept in the default run because the
    # transport is the thing being changed and TestClient never touches it --
    # the marker is for `-m "not slow"` on a tight loop, not for CI to skip.
    "slow: starts a subprocess and waits on it",
]
# src layout: put the package on the path directly rather than depending on an
# editable install. Hatchling writes its .pth without a trailing newline, which
# Python 3.14 does not process, so the editable install silently stops resolving.
pythonpath = ["src"]
