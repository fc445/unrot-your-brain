[project]
name = "unrot"
version = "0.1.0"
description = "Detects concepts you accepted from an AI agent without understanding, and builds a personal knowledge graph from what you confirm."
readme = "README.md"
requires-python = ">=3.11"
# The store and capture layers are deliberately stdlib-only; these are the
# detector's, and nothing below `unrot.detector` imports them. LangChain is here
# for the OpenAI-compatible client and for LangSmith tracing, which the repo
# already uses -- not for an agent framework: the detector is one call, not a graph.
# fastapi/uvicorn are not optional: per the PRD the standalone surface IS the
# product -- Claude Code integration is capture-only -- so the thing that serves
# it is a dependency of the thing, not an extra.
dependencies = [
    "fastapi>=0.115",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unrot"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: put the package on the path directly rather than depending on an
# editable install. Hatchling writes its .pth without a trailing newline, which
# Python 3.14 does not process, so the editable install silently stops resolving.
pythonpath = ["src"]
